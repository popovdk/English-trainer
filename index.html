<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Интерактивные тренажёры британского английского." />
    <title>English Trainer — тренажёры британского английского</title>
  </head>
  <body>
    <header id="app-header"></header>

    <main class="container page">
      <section class="hero">
        <div class="hero__content">
          <span class="hero__badge">🇬🇧 British English</span>
          <h1 class="hero__title">Тренажёры английского</h1>
          <p class="hero__text">Короткие интерактивные упражнения: крутите, нажимайте, слушайте — и запоминайте.</p>
        </div>
        <div class="hero__decor" aria-hidden="true">
          <span class="hero__bubble hero__bubble--1">Hello!</span>
          <span class="hero__bubble hero__bubble--2">quarter past</span>
          <span class="hero__bubble hero__bubble--3">cheers</span>
        </div>
      </section>

      <section aria-labelledby="trainers-title">
        <h2 class="section-title" id="trainers-title">Тренажёры</h2>
        <div class="trainer-grid" id="trainer-grid"></div>
      </section>
    </main>

    <script type="module" src="/src/home.js"></script>
  </body>
</html>
